name: Release

on:
  workflow_dispatch:

concurrency:
  group: stabileo-engine-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Enforce main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main" >&2
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@latest

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Verify committed release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -n "$VERSION"
          node ./src/scripts/sync-version.mjs "$VERSION"
          git diff --exit-code -- package.json src/version.ts
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and verify checked-in vendored source
        run: pnpm check

      - name: Create exact publication tarball
        id: pack
        run: |
          EXPECTED="stabileo-engine-${{ steps.version.outputs.version }}.tgz"
          npm pack
          TARBALL="$EXPECTED"
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Secure or validate the release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish or resume the exact tarball through npm trusted publishing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL="${{ steps.pack.outputs.tarball }}"
          test -f "$TARBALL"
          LOCAL_SHASUM=$(sha1sum "$TARBALL" | awk '{print $1}')
          test -n "$LOCAL_SHASUM"

          if REGISTRY_SHASUM=$(npm view "stabileo-engine@$VERSION" dist.shasum 2>/dev/null); then
            test -n "$REGISTRY_SHASUM"
            test "$REGISTRY_SHASUM" = "$LOCAL_SHASUM"
            echo "Registry already contains the exact verified tarball."
          else
            npm publish "$TARBALL" --access public
          fi

          PUBLISHED_SHASUM=""
          for attempt in $(seq 1 12); do
            PUBLISHED_SHASUM=$(npm view "stabileo-engine@$VERSION" dist.shasum 2>/dev/null || true)
            if [ "$PUBLISHED_SHASUM" = "$LOCAL_SHASUM" ]; then break; fi
            sleep 5
          done
          test "$PUBLISHED_SHASUM" = "$LOCAL_SHASUM"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            ${{ steps.pack.outputs.tarball }}
            dist/stabileo-engine.wasm
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.publish.outputs.tag }}

      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: release-assets

      - name: Create, resume, or validate GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
          TARBALL: ${{ needs.publish.outputs.tarball }}
        run: |
          sh ./src/scripts/publish-github-release.sh \
            "$TAG" \
            "$VERSION" \
            "release-assets/$TARBALL" \
            "release-assets/stabileo-engine.wasm"
